name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v0.14.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "cli -> target"

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: updater/go.sum

      - name: Run Updater Tests (Go)
        working-directory: updater
        run: go test ./...

      - name: Run CLI Tests (Rust)
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Create Artifacts Directory
        run: |
          mkdir dist

      # Build the updater first: the CLI embeds cli/bin/wemod-pro-unlocker-updater.exe
      # via include_bytes!, so it is refreshed from updater/ before compiling the CLI.
      - name: Build Updater Binary (Go)
        shell: powershell
        run: |
          Push-Location updater
          go build -trimpath -ldflags="-s -w" -o ..\dist\updater.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item dist\updater.exe cli\bin\wemod-pro-unlocker-updater.exe -Force

      - name: Build CLI Binary (Rust)
        shell: powershell
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item cli\target\release\wemod-pro-unlocker.exe dist\wemod-pro-unlocker.exe

      - name: Create Release ZIP Archive
        shell: powershell
        run: |
          Compress-Archive -Path "dist\wemod-pro-unlocker.exe", "dist\updater.exe" -DestinationPath "dist\wemod-pro-unlocker-windows-x64.zip" -Force

      - name: Determine Release Tag
        id: tag_name
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            echo "tag=${{ inputs.release_tag }}" >> $env:GITHUB_OUTPUT
          } else {
            $ref = "${{ github.ref }}"
            $tag = $ref.Replace("refs/tags/", "")
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/wemod-pro-unlocker.exe
            dist/updater.exe
            dist/wemod-pro-unlocker-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
